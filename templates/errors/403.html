{% extends "base.html" %}
{% block title %}403 — Forbidden{% endblock %}
{% block content %}
<div class="container py-5 mt-5 text-center">
  <div class="glass-card p-5 d-inline-block" data-aos="zoom-in">
    <div class="text-cyan" style="font-size:5rem;font-weight:700;font-family:var(--mono);">403</div>

  </div>
</div>
{% endblock %}
