{% extends "base.html" %}
{% block title %}404 — Page Not Found{% endblock %}
{% block content %}
<div class="container py-5 mt-5 text-center">
  <div class="error-page glass-card p-5 d-inline-block" data-aos="zoom-in">
    <div class="text-cyan" style="font-size:6rem;font-weight:700;font-family:JetBrains Mono,monospace;">404</div>
    <h3 class="mb-3">Page Not Found</h3>
    <p class="text-muted mb-4">The page you're looking for doesn't exist or has been moved.</p>
    <a href="/" class="btn btn-cyber"><i class="fas fa-home me-2"></i>Back to Home</a>
  </div>
</div>
{% endblock %}
